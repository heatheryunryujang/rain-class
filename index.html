<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>비 오는 날, 우산이 없다면?</title>
<meta property="og:title" content="비 오는 날, 우산이 없다면?">
<meta property="og:description" content="초등학생으로 돌아가 일상의 질문을 모으고, 교사로 변신해서 그 질문으로 수업을 만들어 봐요.">
<meta property="og:image" content="images/card.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 1부는 비 오는 하늘색, 2부는 교실 칠판색. 기억에 남는 한 가지: 빗물이 차오르는 6칸 우량계 */
:root{
  --sky:#E7EDF3;      /* 1부 바탕: 비 오는 하늘 */
  --paper:#FFFDF8;    /* 카드·입력 바탕 */
  --ink:#24303D;      /* 글자 */
  --soft:#5D6B79;     /* 보조 글자 */
  --line:#C9D3DD;     /* 테두리 */
  --rain:#3D78C6;     /* 주요 버튼, 빗물 */
  --rain-deep:#2B5C9E;
  --sun:#F2C14E;      /* 주인공 노란 옷 */
  --board:#2F4A3E;    /* 2부 칠판 */
  --chalk:#F3F1E7;
  --pin-me:#FCE9A6;   /* 포스트잇: 나 */
  --pin-exp:#D3E5F8;  /* 포스트잇: 내가 겪은 일 */
  --pin-fr:#F8D9D6;   /* 포스트잇: 친구 */
  --warn:#B4532A;
  --hand:"Gaegu","Gowun Dodum",cursive;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  -webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
body.teacher{background:var(--chalk)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* ---------- 위쪽 띠 ---------- */
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:var(--sky)}
body.teacher #top{background:var(--board);color:var(--chalk)}
#top .back{width:40px;height:40px;border:0;background:transparent;font-size:22px;border-radius:50%}
#top .back[hidden]{display:none}
#top .prog{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#B9C6D3;display:block}
.dots i.on{background:var(--rain)}
.gauge{display:flex;gap:4px;align-items:flex-end}
.gauge i{position:relative;width:22px;height:26px;border:2px solid var(--chalk);border-top:0;border-radius:0 0 6px 6px;overflow:hidden;display:block}
.gauge i::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:#7FB2EA;transition:height .6s ease}
.gauge i.on::after{height:100%}
.gauge i.now{border-color:var(--sun)}
.stepname{font-size:14px;margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nb{height:40px;padding:0 12px;border:2px solid var(--ink);color:var(--ink);border-radius:20px;background:var(--pin-me);font-family:var(--hand);font-weight:700;font-size:18px;display:flex;align-items:center;gap:4px}
#nb[hidden]{display:none}
body.teacher #nb{border-color:var(--chalk)}

/* ---------- 본문 ---------- */
#screen{flex:1;padding:4px 16px 120px}
.scene{margin:0 -16px 14px;position:relative;background:#dfe6ec}
.scene img{display:block;width:100%;height:auto}
.scene .bub{position:absolute;transform:translate(-50%,-50%);font-family:var(--hand);font-weight:700;color:var(--ink);
  text-align:center;line-height:1.05;font-size:clamp(12px,4.1vw,19px);pointer-events:none}
.story{font-size:17px;margin-bottom:14px}
.story b{font-weight:normal;background:linear-gradient(transparent 60%,var(--pin-me) 60%)}
h1.hand,h2.hand{font-family:var(--hand);font-weight:700;line-height:1.15}
h1.hand{font-size:40px;margin:18px 0 6px}
h2.hand{font-size:28px;margin:6px 0 4px}
.lead{color:var(--soft);margin-bottom:16px}
.say{display:inline-block;background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:8px 14px;
  font-family:var(--hand);font-weight:700;font-size:21px;line-height:1.25;margin:0 0 12px;position:relative}
.say small{display:block;font-family:var(--body);font-weight:normal;font-size:12px;color:var(--soft)}

/* 선택 버튼 */
.choices{display:flex;flex-direction:column;gap:10px;margin:6px 0 10px}
.choice{min-height:54px;padding:10px 16px;border:2px solid var(--ink);border-radius:14px;background:var(--paper);
  text-align:left;font-size:17px;box-shadow:0 3px 0 var(--ink);transition:transform .08s}
.choice:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}

/* 아래 고정 버튼 */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
  background:linear-gradient(to top,var(--sky) 70%,rgba(231,237,243,0))}
body.teacher #bar{background:linear-gradient(to top,var(--chalk) 70%,rgba(243,241,231,0))}
#bar .in{max-width:448px;margin:0 auto}
#bar .why{font-size:13px;color:var(--soft);text-align:center;margin-bottom:6px;min-height:1em}
.next{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--rain);color:#fff;font-size:18px}
.next:disabled{background:#AEB9C4}
.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.row2{display:flex;gap:8px}
.row2 > *{flex:1}

/* 입력 */
label.f{display:block;font-size:15px;margin:14px 0 6px}
label.f small{color:var(--soft)}
.inp,.ta{width:100%;border:2px solid var(--line);border-radius:12px;background:var(--paper);padding:12px 14px;font-size:17px}
.ta{min-height:76px;resize:vertical;line-height:1.5}
.inp:focus,.ta:focus{border-color:var(--rain);outline:none}
.warn{display:none;color:var(--warn);font-size:13px;margin-top:4px}
.warn.show{display:block}
.hintbtn{border:0;background:transparent;color:var(--rain-deep);font-size:14px;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.hints{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.hint{border:1.5px dashed var(--rain);background:#F2F7FD;border-radius:10px;padding:6px 10px;font-size:14px;text-align:left}

/* 칩 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:8px 13px;border:2px solid var(--line);border-radius:21px;background:var(--paper);font-size:15px;text-align:left;position:relative}
.chip.on{border-color:var(--board);background:var(--board);color:var(--chalk)}
.chip .n{display:inline-block;min-width:20px;height:20px;border-radius:10px;background:var(--sun);color:var(--ink);font-size:12px;text-align:center;line-height:20px;margin-right:6px}
.chip .rec{font-size:11px;color:var(--rain-deep);margin-left:4px}
.chip.on .rec{color:var(--sun)}
.add{display:flex;gap:6px;margin-top:8px}
.add .inp{padding:8px 12px;font-size:15px}
.add button{flex:none;border:2px solid var(--ink);border-radius:12px;background:var(--paper);padding:0 14px}

/* 카드형 선택 */
.cards{display:grid;gap:8px}
.card{border:2px solid var(--line);border-radius:14px;background:var(--paper);padding:12px 14px;text-align:left;font-size:15px}
.card.on{border-color:var(--board);box-shadow:inset 0 0 0 2px var(--board);background:#EEF3EF}

/* 포스트잇 */
.pins{display:flex;flex-wrap:wrap;gap:8px}
.pin{width:calc(50% - 4px);min-height:66px;padding:8px 10px;border:0;border-radius:3px;font-family:var(--hand);font-weight:700;font-size:17px;
  line-height:1.15;text-align:left;box-shadow:0 2px 4px rgba(36,48,61,.18);position:relative}
.pin.me{background:var(--pin-me)} .pin.exp{background:var(--pin-exp)} .pin.fr{background:var(--pin-fr)}
.pin.sel{outline:3px solid var(--ink);outline-offset:1px;transform:rotate(-1.5deg)}
.pin .who{display:block;font-family:var(--body);font-weight:normal;font-size:11px;color:var(--soft);margin-top:4px}
.box{border:2px dashed var(--board);border-radius:14px;padding:10px;margin-top:10px;background:#fff}
.box.target{border-style:solid;background:#F1F6F2}
.box .hd{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.box .hd .inp{padding:8px 10px;font-size:16px}
.box .hd .x{flex:none;border:0;background:transparent;font-size:20px;width:36px;height:36px;color:var(--soft)}
.box .empty{font-size:13px;color:var(--soft);padding:6px 2px}
.box .pin{width:calc(50% - 4px);min-height:54px;font-size:15px}
.howto{margin:2px 0 10px 20px;font-size:14px;line-height:1.5;color:var(--ink)}
.howto li{margin-bottom:4px}
.howto b{display:block;font-weight:normal;text-decoration:underline;text-underline-offset:3px}
.own{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:15px}
.own .inp{width:110px;padding:8px 12px;font-size:16px}
.legend{font-size:12px;color:var(--soft);display:flex;gap:10px;margin:4px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}

/* 질문 수첩 시트 */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.open{display:block}
.sheet .dim{position:absolute;inset:0;background:rgba(20,28,36,.45)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:82%;overflow:auto;
  background:var(--paper);border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 20px)}
.sheet .panel h3{font-family:var(--hand);font-size:26px;margin-bottom:8px}
.sheet .close{float:right;border:0;background:transparent;font-size:24px;width:40px;height:40px}

/* 토스트 */
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);opacity:0;z-index:60;pointer-events:none;
  background:var(--pin-me);border-radius:4px;padding:10px 14px;font-family:var(--hand);font-weight:700;font-size:18px;
  box-shadow:0 4px 10px rgba(36,48,61,.25);transition:all .35s ease;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0) rotate(-2deg)}

/* 친구 */
.friends{display:flex;justify-content:space-between;gap:6px;margin:6px 0 10px}
.friend{flex:1;border:0;background:transparent;text-align:center;font-size:13px}
.friend img{width:100%;max-width:64px;aspect-ratio:1;border-radius:50%;border:3px solid var(--line);display:block;margin:0 auto 4px;background:#fff}
.friend.heard img{border-color:var(--rain)}
.friend.heard span::after{content:" ✓";color:var(--rain)}
.talk{min-height:64px}

/* 주제망 */
.map{position:relative;width:100%;aspect-ratio:1/1.3;margin:8px 0 4px}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);width:31%;border:2px solid var(--board);background:#fff;border-radius:12px;
  padding:6px 7px;font-size:13px;line-height:1.3;text-align:left}
.node.core{width:36%;background:var(--board);color:var(--chalk);text-align:center;font-size:14px;border-radius:50%/44%;padding:14px 10px}
.node b{display:block;font-weight:normal;font-family:var(--hand);font-size:17px;font-weight:700;line-height:1.1}
.node ul{list-style:none;margin-top:3px}
.node li{font-size:12px;color:var(--soft);border-top:1px dotted var(--line);padding-top:2px;margin-top:2px}
.node .tap{display:block;font-size:11px;color:var(--rain-deep);margin-top:2px}
.node.done{border-color:var(--rain)}

.kwl{border:2px solid var(--board);border-radius:12px;padding:10px 12px;margin-top:12px;background:#fff;font-size:14px}
.kwl summary{cursor:pointer;font-size:15px}
.kwl ol{margin:6px 0 0 20px}
.cite{font-size:11px;color:var(--soft);margin-top:18px}

/* 모달 */
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(20,28,36,.45)}
.modal.open{display:flex}
.modal .m{background:var(--paper);border-radius:16px;padding:20px;max-width:380px;width:100%}
.modal .m p{margin-bottom:14px}

/* 칠판 머리 */
.boardhead{background:var(--board);color:var(--chalk);margin:0 -16px 14px;padding:4px 16px 16px}
.boardhead h2{font-family:var(--hand);font-weight:700;font-size:30px;line-height:1.1}
.boardhead p{font-size:15px;opacity:.9}

/* 수업설계안 */
.plan{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:16px;margin-bottom:14px}
.plan .who{font-size:13px;color:var(--soft)}
.plan .big{font-family:var(--hand);font-weight:700;font-size:26px;line-height:1.15;margin:4px 0 6px}
.plan h4{font-size:13px;color:var(--soft);font-weight:normal;margin:14px 0 4px;border-top:1px solid var(--line);padding-top:10px}
.plan p,.plan li{font-size:15px}
.plan ul{list-style:none}
.plan li{padding-left:12px;position:relative}
.plan li::before{content:"";position:absolute;left:0;top:.7em;width:5px;height:5px;border-radius:50%;background:var(--rain)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tags span{font-size:12px;background:var(--sky);border-radius:10px;padding:2px 8px}
.status{font-size:14px;text-align:center;margin:8px 0;min-height:1.4em}
.status.ok{color:#2B7A4B} .status.err{color:var(--warn)}

.testbadge{position:fixed;right:8px;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:30;background:var(--warn);color:#fff;font-size:12px;padding:3px 8px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="back" id="back" aria-label="뒤로 가기">←</button>
    <div class="prog" id="prog"></div>
    <button id="nb" aria-label="질문 수첩 열기">📒 <span id="nbc">0</span></button>
  </header>
  <main id="screen"></main>
</div>
<div id="bar"><div class="in"><div class="why" id="why"></div><div id="barbtn"></div></div></div>
<div class="sheet" id="sheet"><div class="dim" data-act="closeSheet"></div><div class="panel" id="sheetPanel"></div></div>
<div class="modal" id="modal"><div class="m" id="modalBody"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script>
(function(){

/* ===================== 기본 데이터 ===================== */

var Q = {

  bag:   {t:"왜 팔만 이렇게 젖었지? 몸을 다 가리려면 어떻게 해야 하지?", k:"exp", tag:"avoid", who:"나 (등굣길)"},

];

};
var GENERIC_SUBS = ["이것에 대해 무엇을 알고 싶나?","어떻게 알아낼까?"];

  {t:"젖은 끈과 마른 끈, 잘 풀리는 쪽 실험", tag:"lace"},
  {t:"마른 바닥·젖은 바닥 미끄러움 비교", tag:"lace"},
  {t:"비 오는 날 등굣길 안전 지도 만들기", tag:"lace"},

];
var BIG_HINTS = [
  "비 오는 날 아침, 나 혼자서도 준비할 수 있을까?",
  "비 오는 날, 젖지 않고 넘어지지 않고 학교에 오려면?",

function go(id, push){

}
function back(){
  if (!S.hist.length) return;
  S.screen = S.hist.pop(); save(); render(); window.scrollTo(0,0);
}

  document.body.classList.toggle("teacher", teacher);
  $("screen").innerHTML = def.html;
  $("back").hidden = id === "name" || id === "plan" && !!S.submitted;
  // 위쪽 진행 표시
  var p = "";
  var story = ["home","sky","lace","worm","class","think","turn"];
  if (story.indexOf(id) >= 0){
    p = '<div class="dots" aria-label="이야기 진행">' + story.map(function(s, i){ return '<i class="' + (i <= story.indexOf(id) ? "on" : "") + '"></i>'; }).join("") + '</div>';
  } else if (/^d\d$/.test(id)){
    var n = +id[1];
    p = '<div class="gauge" aria-label="수업 설계 ' + n + '단계 / 6">' + STEPS.map(function(s, i){ return '<i class="' + (i < n - 1 ? "on" : "") + (i === n - 1 ? " now" : "") + '"></i>'; }).join("") +

  } else if (id === "done" || id === "check" || id === "plan"){
    p = '<div class="gauge">' + STEPS.map(function(){ return '<i class="on"></i>'; }).join("") + '</div>';
  }
  $("prog").innerHTML = p;
  var nb = notebook();
  $("nb").hidden = id === "name" || nb.length === 0;
  $("nbc").textContent = nb.length;
  // 아래 버튼
  $("barbtn").innerHTML = def.bar || "";
  $("bar").style.display = def.bar ? "" : "none";
  refreshBar();
  if (def.after) def.after();
}

function makeFlow(){
  var L = parseInt(S.lessons, 10) || 8, acts = S.acts.slice(), tail = L >= 6 ? 2 : 1, rem = L - tail, out = [], start = 1;
  if (!acts.length) return "";
  acts.forEach(function(a, i){
    var end = Math.max(start, Math.round(rem * (i + 1) / acts.length));
    out.push((start === end ? start : start + "~" + end) + "차시 " + a);
    start = end + 1 > rem ? end : end + 1;
  });
  out.push((tail === 1 ? L : (L - 1) + "~" + L) + "차시 결과물 만들고 나누기");
  return out.join(" → ");
}

    '<h4>6. 평가</h4><p>결과물: ' + esc(d.outputs.join("·")) + (d.evals.length ? ' / 평가: ' + esc(d.evals.join("·")) : "") + '</p><p>실천: ' + esc(d.action) + '</p>' +
    (d.know || d.can || d.be ? '<ul><li>알게 될 것: ' + esc(d.know) + '</li><li>할 수 있게 될 것: ' + esc(d.can) + '</li><li>어떤 사람이 될까: ' + esc(d.be) + '</li></ul>' : "") +
    '<h4>내가 생각한 우리 수업</h4><ul><li>' + esc(d.ck.owner) + '</li><li>' + esc(d.ck.flow) + '</li><li>' + esc(d.ck.open) + '</li></ul>' +
    '<div class="tags">' + d.ck.subj.map(function(s){ return '<span>' + esc(s) + '</span>'; }).join("") + '</div></div>' +
    '<div class="status" id="status">' + (sent ? "제출했어요." : "") + '</div>' +
    '<div class="row2"><button class="next ghost" data-act="copy">텍스트 복사</button><button class="next ghost" data-act="restart">처음부터</button></div>',
    bar:'<button class="next" data-act="submit">' + (sent ? "단톡방에 보내기" : "제출하고 단톡방에 보내기") + '</button>'};
};

/* ===================== 시트·모달 ===================== */
function openSheet(html){ $("sheetPanel").innerHTML = html; $("sheet").classList.add("open"); }
function closeSheet(){ $("sheet").classList.remove("open"); if (S.screen === "d3") render(); }
function showNotebook(){
  var ids = notebook();
  openSheet('<button class="close" data-act="closeSheet" aria-label="닫기">×</button><h3>📒 질문 수첩</h3>' +
    '<p class="lead" style="margin-bottom:8px">오늘 아침 모인 질문 ' + ids.length + '개</p><div class="pins">' + ids.map(function(id){ return pinHtml(id); }).join("") + '</div>');
}
function confirmBox(text, yes, no, onYes, onNo){
  confirmBox.onNo = onNo;
  $("modalBody").innerHTML = '<p>' + text + '</p><div class="row2"><button class="next ghost" data-act="modalNo">' + no + '</button><button class="next" data-act="modalYes">' + yes + '</button></div>';
  $("modal").classList.add("open");
  confirmBox.onYes = onYes;
}

/* ===================== 입력 처리 ===================== */
document.addEventListener("input", function(e){
  var t = e.target;
  if (t.dataset.bind){ S[t.dataset.bind] = t.value; checkWarn(t.dataset.bind); save(); refreshBar(); return; }
  if (t.id === "f-lessons-own"){
    var v = t.value.replace(/\D/g, "").replace(/^0+/, "").slice(0, 2); if (t.value !== v) t.value = v;
    S.lessons = v ? v + "차시" : "";
    document.querySelectorAll('[data-key="lessons"]').forEach(function(c){ c.classList.remove("on"); });
    save(); refreshBar(); return;
  }
  if (t.dataset.gname){ S.groups.forEach(function(g){ if (g.id === t.dataset.gname) g.name = t.value; }); save(); refreshBar(); return; }
  if (t.dataset.sub){
    var arr = S.subs[t.dataset.sub] || ["",""]; arr[+t.dataset.i] = t.value; S.subs[t.dataset.sub] = arr;
    var w = $("w-sub" + t.dataset.i); if (w){ var bad = SUBJECT_RE.test(t.value); if (bad && !w.classList.contains("show")) S.meta.warn++; w.classList.toggle("show", bad); }
    save(); return;
  }
});
document.addEventListener("keydown", function(e){
  if (e.key === "Enter" && e.target.id === "f-name" && !e.isComposing && S.name.trim()){ e.preventDefault(); go("home"); }
});

document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]"); if (!el) return;
  var a = el.dataset.act, v = el.dataset.val;
  switch (a){
    case "go": if (!el.disabled) go(el.dataset.to); break;
    case "closeSheet": closeSheet(); break;
    case "morning": S.morning = v; save(); render(); break;
    case "path": S.path = v; if (S.nbSeen.indexOf(v) < 0) S.nbSeen.unshift(v); save(); render(); toast("📒 질문 수첩에 질문이 생겼어요"); break;
    case "friend":
      if (S.heard.indexOf(el.dataset.id) < 0){ S.heard.push(el.dataset.id); toast("📒 " + Q[el.dataset.id].who + "의 질문을 적었어요"); }
      lastTalk = el.dataset.id; save(); render(); break;
    case "toggleHint": var h = $("h-" + el.dataset.for); if (h) h.hidden = !h.hidden; break;
    case "useHint":
      S[el.dataset.key] = v; S.meta.hints[S.screen] = true; save(); var f = $("f-" + el.dataset.key); if (f) f.value = v; checkWarn(el.dataset.key); refreshBar(); break;
    case "chip":
      var k = el.dataset.key;
      if (el.dataset.multi === "1"){ var i = S[k].indexOf(v); if (i >= 0) S[k].splice(i, 1); else S[k].push(v); }
      else S[k] = S[k] === v ? "" : v;
      save(); render(); break;
    case "addChip":
      var inp = $("add-" + el.dataset.key), val = inp && inp.value.trim();
      if (val && S[el.dataset.key].indexOf(val) < 0){ S[el.dataset.key].push(val); save(); render(); } break;
    case "pick": S[el.dataset.key] = v; save(); render(); break;
    /* 1단계 */
    case "pin":
      var id = el.dataset.id;
      var inBox = S.groups.filter(function(g){ return g.items.indexOf(id) >= 0; })[0];
      if (inBox){ inBox.items.splice(inBox.items.indexOf(id), 1); selPin = null; }
      else selPin = selPin === id ? null : id;
      e.stopPropagation(); save(); render(); break;
    case "drop":
      if (!selPin) return;
      if (e.target.closest("input,button.x")) return;
      S.groups.forEach(function(g){ if (g.id === el.dataset.g && g.items.indexOf(selPin) < 0) g.items.push(selPin); });
      selPin = null; save(); render(); break;
    case "addGroup":
      if (S.groups.length < 4){ S.groups.push({id:"g" + Date.now(), name:"", items:[], tag:""}); save(); render(); } break;
    case "delGroup":
      S.groups = S.groups.filter(function(g){ return g.id !== el.dataset.g; }); save(); render(); break;
    case "d1names":
      var names = ["날씨","비 피하기","신발끈과 안전","비 오는 날 생물"], used = S.groups.map(function(g){ return g.name; });
      S.groups.forEach(function(g){ if (!g.name.trim()){ var n = names.filter(function(x){ return used.indexOf(x) < 0; })[0]; if (n){ g.name = n; used.push(n); } } });
      S.meta.hints.d1 = true; save(); render(); break;
    case "d1auto":
      var order = ["weather","avoid","lace","life","prep"], cnt = {};
      notebook().forEach(function(id){ var t = Q[id].tag; if (t) cnt[t] = (cnt[t] || 0) + 1; });
      var tags = order.filter(function(t){ return cnt[t]; }).sort(function(x, y){ return cnt[y] - cnt[x]; }).slice(0, 4);
      if (tags.length < 2) tags = tags.concat(order.filter(function(t){ return tags.indexOf(t) < 0; })).slice(0, 2);
      S.groups = tags.map(function(t, i){ return {id:"g" + (i + 1), name:TAGS[t].name, tag:t, items:notebook().filter(function(id){ return Q[id].tag === t; })}; });
      // 4개를 넘는 태그의 질문은 남겨 둠, 내 질문은 직접 넣도록 남겨 둠
      S.meta.hints.d1 = true; selPin = null; save(); render(); toast("묶어 봤어요. 마음에 안 들면 고쳐 보세요"); break;
    case "d1next":
      if (el.disabled) return;
      var lo = loose();
      if (lo.length){
        confirmBox("묶지 않은 질문 " + lo.length + "개는 이번 수업에서 다루지 않아요." + (lo.indexOf("me") >= 0 ? "<br><b>내 질문</b>도 여기에 있어요." : "") + "<br>그대로 갈까요?",
          "그대로 갈게요", "다시 볼게요", function(){ S.meta.left = lo; S.meta.leftMine = lo.indexOf("me") >= 0; go("d2"); });
      } else { S.meta.left = []; S.meta.leftMine = false; go("d2"); }
      break;
    case "modalYes": $("modal").classList.remove("open"); if (confirmBox.onYes) confirmBox.onYes(); break;
    case "modalNo": $("modal").classList.remove("open"); if (confirmBox.onNo) confirmBox.onNo(); break;
    /* 3단계 */
    case "branch": branchSheet(el.dataset.g); break;
    case "subHint":
      var g2 = S.groups.filter(function(x){ return x.id === el.dataset.g; })[0], tg = groupTag(g2), hs = tg ? TAGS[tg].subs : GENERIC_SUBS;
      S.subs[el.dataset.g] = hs.slice(); S.meta.hints.d3 = true; save();
      $("sub0").value = hs[0]; $("sub1").value = hs[1]; break;
    /* 5단계 */
    case "act":
      var j = S.acts.indexOf(v); if (j >= 0) S.acts.splice(j, 1); else S.acts.push(v); save(); render(); break;
    case "addAct":
      var ai = $("add-acts"), av = ai && ai.value.trim(); if (av && S.acts.indexOf(av) < 0){ S.acts.push(av); save(); render(); } break;
    case "flowHint":
      S.flow = makeFlow(); S.meta.hints.d5 = true; save(); $("f-flow").value = S.flow; checkWarn("flow"); break;
    /* 점검 */
    case "ck": S.ck[el.dataset.k] = v; save(); render(); break;
    case "ckSubj": var x = S.ck.subj.indexOf(v); if (x >= 0) S.ck.subj.splice(x, 1); else S.ck.subj.push(v); save(); render(); break;
    /* 설계안 */
    case "copy": copyText(planText(planData())); break;
    case "restart":
      confirmBox("처음부터 다시 할까요? 지금 만든 설계안은 이 휴대폰에서 지워져요.", "처음부터", "취소", function(){ var n = S.name; S = fresh(); S.name = n; save(); render(); });
      break;
    case "submit": submit(); break;
  }
});
$("back").addEventListener("click", back);
$("nb").addEventListener("click", showNotebook);

function copyText(t){
  var done = function(){ setStatus("설계안을 복사했어요. 단톡방에 붙여 넣으세요.", "ok"); };
  var fallback = function(){
    var ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ setStatus("복사가 안 됐어요. 화면을 캡처해서 올려 주세요.", "err"); }
    document.body.removeChild(ta);
  };
  try{ navigator.clipboard.writeText(t).then(done, fallback); }catch(e){ fallback(); }
}
function setStatus(msg, cls){ var s = $("status"); if (s){ s.textContent = msg; s.className = "status " + (cls || ""); } var w = $("why"); w.textContent = msg; w.style.color = cls === "err" ? "var(--warn)" : cls === "ok" ? "#2B7A4B" : ""; }

/* ===================== 제출 + 카카오 공유 ===================== */
function submit(){
  var d = planData();
  if (S.submitted){ share(d, S.submitted); return; }
  if (!CFG.SCRIPT_URL){ setStatus("아직 저장 주소가 설정되지 않았어요. 텍스트 복사로 단톡방에 올려 주세요.", "err"); return; }
  setStatus("제출하고 있어요…");
  var btn = document.querySelector("#barbtn .next"); if (btn) btn.disabled = true;
  fetch(CFG.SCRIPT_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action:"submit", data:d})})
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (!res || !res.ok) throw new Error(res && res.error || "저장 실패");
      S.submitted = res.id; save(); render(); setStatus("제출했어요! 이제 단톡방을 골라 보내 주세요.", "ok");
      share(d, res.id);
    })
    .catch(function(){
      if (btn) btn.disabled = false;
      setStatus("저장이 안 됐어요. 다시 누르거나, 텍스트 복사로 단톡방에 올려 주세요.", "err");
    });
}
var kakaoReady = null;
function loadKakao(){
  if (kakaoReady) return kakaoReady;
  kakaoReady = new Promise(function(ok, no){
    if (!CFG.KAKAO_JS_KEY) return no();
    var s = document.createElement("script");
    s.src = "https://t1.kakaocdn.net/kakao_js_sdk/2.8.3/kakao.min.js"; s.crossOrigin = "anonymous";
    s.onload = function(){ try{ if (!Kakao.isInitialized()) Kakao.init(CFG.KAKAO_JS_KEY); ok(); }catch(e){ no(e); } };
    s.onerror = no; document.head.appendChild(s);
  });
  return kakaoReady;
}
function share(d, id){
  var base = CFG.SITE_URL || (location.origin + location.pathname.replace(/[^/]*$/, ""));
  var url = base + "view.html?id=" + encodeURIComponent(id) + (TEST ? "&test" : "");
  loadKakao().then(function(){
    Kakao.Share.sendDefault({
      objectType:"feed",
      content:{title:d.name + "의 수업설계안", description:d.big.slice(0, 80), imageUrl:base + "images/plan-card.jpg", imageWidth:750, imageHeight:1004, link:{mobileWebUrl:url, webUrl:url}},
      buttons:[{title:"설계안 보기", link:{mobileWebUrl:url, webUrl:url}}]
    });
  }).catch(function(){
    setStatus("카카오 공유가 안 돼요. 텍스트 복사로 단톡방에 올려 주세요.", "err");
  });
}

/* ===================== 시작 ===================== */
if (TEST){ var b = document.createElement("div"); b.className = "testbadge"; b.textContent = "리허설"; document.body.appendChild(b); }
if (S.screen !== "name" && S.screen !== "plan"){
  var resumeAt = S.screen; S.screen = "name";
  render();
  confirmBox("아까 하던 곳에서 이어 할까요?", "이어서 하기", "처음부터",
    function(){ S.screen = resumeAt; save(); render(); },
    function(){ var n = S.name; S = fresh(); S.name = n; save(); render(); });
} else render();
})();
</script>
